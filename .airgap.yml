# .airgap.yml — AGSSH-STD-001 conformance declaration for https://audiolibri.org/
target_profile: Silver
level: L2

surfaces:
  - url: https://audiolibri.org/
    kind: site
    stateless: true

backend: github-pages

dns:
  zone: audiolibri.org

pipeline:
  enforce_ci_rules: false

allow:
  connect:      []
  storage:      []
  embeds:       []
  subresources: ["static.cloudflareinsights.com"]

waivers:
  budget: { max_count: 3, max_weight: 6, max_window_days: 30 }

deviations: []
