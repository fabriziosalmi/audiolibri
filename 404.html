<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Pagina non trovata — Audiolibri.org</title>
<link rel="icon" href="/icons/favicon.ico">
<link rel="stylesheet" href="/app.css">
<style>
.nf404 { max-width: 640px; margin: 0 auto; padding: clamp(3rem,10vh,6rem) 1.5rem; text-align: center; }
.nf404-eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: var(--text-xs); font-weight: 700; color: var(--primary-color); }
.nf404 h1 { font-family: var(--font-display); font-size: clamp(3.5rem,16vw,6rem); line-height: 1; color: var(--header-color); margin: .3rem 0 0; }
.nf404 h2 { font-family: var(--font-display); font-size: var(--text-2xl); margin: .4rem 0 1rem; color: var(--text-color); }
.nf404 p { color: var(--secondary-text); font-size: var(--text-lg); line-height: 1.6; margin: 0 auto 2rem; max-width: 46ch; }
.nf404-links { display: flex; flex-wrap: wrap; gap: .7rem; justify-content: center; }
.nf404-links a { padding: .6rem 1.2rem; border: 1px solid var(--border-color); border-radius: var(--radius-pill); text-decoration: none; color: var(--text-color); font-weight: 600; transition: background-color .2s, border-color .2s; }
.nf404-links a:hover { background: var(--hover-overlay); border-color: var(--secondary-text); }
.nf404-links a.primary { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
</style>
</head>
<body>
<main class="nf404">
  <p class="nf404-eyebrow">Audiolibri.org</p>
  <h1>404</h1>
  <h2>Pagina non trovata</h2>
  <p>L'audiolibro o la pagina che cerchi non esiste, o è stata spostata. Ma abbiamo migliaia di titoli da ascoltare gratis, in streaming e senza registrazione.</p>
  <div class="nf404-links">
    <a class="primary" href="/">← Torna alla home</a>
    <a href="/generi/">Generi</a>
    <a href="/autori/">Autori</a>
    <a href="/raccolte/">Raccolte</a>
  </div>
</main>
</body>
</html>
